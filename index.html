<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>BlobBoard</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #2b2a28;
      --muted: #7a756d;
      --blob: #ff9f8a;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }
    .blob {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blob);
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
      animation: morph 11s ease-in-out infinite, bob 6s ease-in-out infinite;
    }
    @keyframes morph {
      0%, 100% { border-radius: 60% 40% 55% 45% / 55% 45% 60% 40%; }
      33%      { border-radius: 45% 55% 40% 60% / 60% 40% 55% 45%; }
      66%      { border-radius: 55% 45% 60% 40% / 45% 55% 40% 60%; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; border-radius: 50%; }
    }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <div class="blob">BlobBoard</div>
  <p>Phase 0 — setup check. Υγεία · Greek text test.</p>
  <p id="info"></p>
  <script type="module">
    document.getElementById('info').textContent = 'Modules OK · ' + (window.isSecureContext ? 'secure context' : 'NOT secure');
  </script>
</body>
</html>
